<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PES 2021 EDITOR PRO</title>
<link rel="stylesheet" href="styles.css?v=per38-20261106">
</head>
<body>
<div id="app">
  <!-- ============ BARRA LATERAL ============ -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-info">
        <img src="assets/logo.jpg" alt="Logo" class="brand-logo">
        <div class="brand-text">
          <div class="brand-name">PES 2021</div>
          <div class="brand-sub">EDITOR PRO</div>
        </div>
      </div>
      <button id="sidebarToggle" class="sidebar-toggle" title="Minimizar barra lateral">◀</button>
    </div>

    <nav id="nav">
      <button class="nav-item active" data-section="inicio" title="Inicio"><span class="nav-ico">🏠</span> <span class="nav-text">Inicio</span></button>
      <button class="nav-item" data-section="ligas" title="Ligas y Copas"><span class="nav-ico">🏆</span> <span class="nav-text">Ligas y Copas</span> <span class="nav-count" id="countLigas"></span></button>
      <button class="nav-item" data-section="crear" title="Crear Liga"><span class="nav-ico">➕</span> <span class="nav-text">Crear Liga</span></button>
      <button class="nav-item" data-section="equipos" title="Equipos"><span class="nav-ico">🛡️</span> <span class="nav-text">Equipos</span> <span class="nav-count" id="countEquipos"></span></button>
      <button class="nav-item" data-section="jugadores" title="Jugadores"><span class="nav-ico">⚽</span> <span class="nav-text">Jugadores</span> <span class="nav-count" id="countJugadores"></span></button>
      <div class="nav-sep"></div>
      <button class="nav-item" data-section="piramide" title="Pirámide"><span class="nav-ico">🌲</span> <span class="nav-text">Pirámide</span></button>
      <button class="nav-item" data-section="sider" title="Sider y Lua"><span class="nav-ico">⚙️</span> <span class="nav-text">Sider y Lua</span></button>
      <button class="nav-item" data-section="diagnostico" title="Diagnóstico"><span class="nav-ico">🩺</span> <span class="nav-text">Diagnóstico</span></button>
      <button class="nav-item" data-section="mundo" title="Mundo"><span class="nav-ico">🌍</span> <span class="nav-text">Mundo</span></button>
      <button class="nav-item" data-section="edit" title="Guardado EDIT"><span class="nav-ico">💾</span> <span class="nav-text">Guardado EDIT</span></button>
      <button class="nav-item" data-section="config" title="Configuración"><span class="nav-ico">🧭</span> <span class="nav-text">Configuración</span></button>
      <button class="nav-item" data-section="creditos" title="Créditos"><span class="nav-ico">ℹ️</span> <span class="nav-text">Créditos</span></button>
    </nav>

    <div class="side-foot">
      <div class="db-status">
        <span class="dot dot-off" id="dbDot"></span>
        <div>
          <div class="db-status-title" id="dbStatusTitle">Sin base cargada</div>
          <div class="db-status-sub" id="dbStatusSub">Configurá tus rutas para empezar</div>
        </div>
      </div>
      <button class="btn btn-save" id="btnSave" disabled title="Guardar (.bin)"><span class="save-ico">💾</span> <span class="btn-save-text">Guardar (.bin)</span></button>
      <div class="bridge-status" id="bridgeStatus">Conectando con el núcleo…</div>
    </div>
  </aside>

  <!-- ============ AREA PRINCIPAL ============ -->
  <main id="main">
    <section class="page active" id="page-inicio"></section>
    <section class="page" id="page-ligas"></section>
    <section class="page" id="page-crear"></section>
    <section class="page" id="page-equipos"></section>
    <section class="page" id="page-jugadores"></section>
    <section class="page" id="page-piramide"></section>
    <section class="page" id="page-sider"></section>
    <section class="page" id="page-diagnostico"></section>
    <section class="page" id="page-mundo"></section>
    <section class="page" id="page-edit"></section>
    <section class="page" id="page-config"></section>
    <section class="page" id="page-creditos"></section>
  </main>
</div>

<div id="toast"></div>
<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <div id="modal-head"><span id="modal-title"></span><button id="modal-close" class="icon-btn">✕</button></div>
    <div id="modal-body"></div>
    <div id="modal-foot"></div>
  </div>
</div>

<script src="js/core.js?v=per38-20261106"></script>
<script src="js/inicio.js?v=per38-20261106"></script>
<script src="js/ligas.js?v=per38-20261106"></script>
<script src="js/crear.js?v=per38-20261106"></script>
<script src="js/pitch.js?v=per38-20261106"></script>
<script src="js/equipos.js?v=per38-20261106"></script>
<script src="js/jugadores.js?v=per38-20261106"></script>
<script src="js/otros.js?v=per38-20261106"></script>
<script src="js/mundo.js?v=per38-20261106"></script>
<script src="js/diagnostico.js?v=per38-20261106"></script>
</body>
</html>
